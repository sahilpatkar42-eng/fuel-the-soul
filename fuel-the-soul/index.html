<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Store manager | Fuel The Soul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <span class="brand">Fuel The Soul</span>
    <h1>Store manager</h1>
    <label>Password<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary">Log in</button>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside class="side">
    <span class="brand">Fuel The Soul</span>
    <nav id="tabs">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="products">Products</button>
      <button data-tab="offers">Offers</button>
      <button data-tab="orders">Orders <i id="newCount" hidden></i></button>
      <button data-tab="site">Website text</button>
    </nav>
    <div class="side-foot"><a href="/" target="_blank" rel="noopener">View website</a><button id="logout">Log out</button></div>
  </aside>
  <main><div id="view"></div></main>
</div>

<div class="mdl" id="mdl" hidden></div>
<div class="toasts" id="toasts"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
